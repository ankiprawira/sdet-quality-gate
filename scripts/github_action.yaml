name: quality-gate

on:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            application_code/package-lock.json

      - name: Start API and checkout app
        run: bash scripts/start-apps.sh

      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps chromium

      - name: Generate API tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate:api

      - name: Generate E2E tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate:e2e

      - name: Run API and web tests
        env:
          CI: "true"
          STAGING_API_URL: http://127.0.0.1:8080
          STAGING_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test --project=api-tests --project=chromium

      - name: Upload logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-results
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
